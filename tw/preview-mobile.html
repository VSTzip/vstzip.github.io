<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>preview 390</title>
<style>
  html,body{margin:0;padding:0;background:#ddd}
  iframe{width:390px;border:0;display:block;margin:0 auto;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="index.html" scrolling="no"></iframe>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      f.style.height = h + 'px';
    } catch (e) {}
  });
</script>
</body>
</html>
