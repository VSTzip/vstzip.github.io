<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>390px 미리보기 (임시)</title>
<style>
  body{margin:0;background:#71717A;font:12px/1.4 -apple-system,sans-serif;color:#fff}
  .row{display:flex;gap:16px;padding:16px;align-items:flex-start}
  .frame{width:390px;flex:0 0 390px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .label{padding:6px 10px;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  iframe{display:block;width:390px;height:820px;border:0;background:#fff}
</style>
</head>
<body>
  <div class="row">
    <div class="frame"><div class="label">/vn/ · 390px</div><iframe src="https://vstzip.github.io/vn/" title="vn mobile"></iframe></div>
    <div class="frame"><div class="label">/es/ · 390px</div><iframe src="https://vstzip.github.io/es/" title="es mobile"></iframe></div>
  </div>
  <div class="row">
    <div class="frame"><div class="label">/vn/#gear · 390px</div><iframe src="https://vstzip.github.io/vn/#gear" title="vn mobile gear"></iframe></div>
    <div class="frame"><div class="label">/es/#gear · 390px</div><iframe src="https://vstzip.github.io/es/#gear" title="es mobile gear"></iframe></div>
  </div>
</body>
</html>
